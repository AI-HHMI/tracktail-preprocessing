[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracktail-preprocessing"
version = "0.8.0"
dependencies = [
    "aniposelib>=0.7.0",
    "av>=10.0.0",
    "decord>=0.6.0",
    "easydict==1.13",
    "json5==0.12.1",
    "opencv-python==4.9.0.80",
    "polars>=1.0.0",
    "scipy>=1.10",
    "toml==0.10.2",
    "einops>=0.8.2,<0.9",
    "pyyaml>=6.0.3,<7"]
requires-python = ">=3.9"
description = "Converters that turn public multi-view 3D tracking datasets into the trial layout used by Tracktail"
readme = "README.md"
license = {text = "BSD-3-Clause"}
keywords = ["data preprocessing", "pose estimation", "animal pose estimation"]
classifiers = [
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: BSD License',
    'Programming Language :: Python :: 3'
]


[project.urls]
Repository = "https://github.com/AI-HHMI/tracktail-preprocessing"

[tool.setuptools.packages.find]
include = ["tracktail_preprocessing*", "posetail_preprocessing*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
tracktail-preprocessing = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
ffmpeg = ">=8.0.1,<9"
pytables = ">=3.6"
numpy = "<2"
pandas = ">=2,<2.3"
